server.port=8080
server.address=0.0.0.0

spring.application.name=online-quiz-management-system

# Firebase Configuration
# Path to service account private key JSON file (optional, defaults to serviceAccountKey.json if present)
firebase.config.path=${FIREBASE_CONFIG_PATH:serviceAccountKey.json}
firebase.database.url=${FIREBASE_DATABASE_URL:}

# Logging
logging.level.com.quizsystem=INFO
logging.level.org.springframework.web=INFO
